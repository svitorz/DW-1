<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Praticando 2 - </title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
  <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
    crossorigin="anonymous"></script>
</head>

<body>
  <div class="container-fluid">
    <h1 class="text-center">
      Praticando 2 - JavaScript - Mini calculadora
    </h1>
    <div class="container p-2">
      <div class="row g-3 mb-3">
        <div class="col-md-4">
          <label for="numero_1" class="form-label">Número 1</label>
          <input type="number" class="form-control" id="numero_1">
        </div>

        <div class="col-md-4">
          <label for="numero_2" class="form-label">Número 2</label>
          <input type="number" class="form-control" id="numero_2">
        </div>

        <div class="col-md-4">
          <label for="resultado" class="form-label">Resultado</label>
          <input type="text" disabled class="form-control" id="resultado" readonly>
        </div>
      </div>

      <div class="d-flex flex-wrap gap-2">
        <button type="button" id="soma" class="btn btn-primary">Soma</button>
        <button type="button" id="sub" class="btn btn-primary">Subtração</button>
        <button type="button" id="mult" class="btn btn-primary">Multiplicação</button>
        <button type="button" id="divs" class="btn btn-primary">Divisão</button>
      </div>
    </div>
  </div>
  <script src="./script.js"> </script>
</body>

</html>
