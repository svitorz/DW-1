<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Praticando 1 - JavaScript</title>
</head>

<body>
  <h1>
    Praticando 1 - JavaScript
  </h1>
  <p>Seja bem vindo <strong> <span id="user_name"></span> </strong> </p>
  <button type="button" onclick="addText()">Adicionar texto (parágrafo de Lorem Ipsum)</button>
  <br />
  <button type="button" onclick="clearText()">Remover texto (todos os parágrafos)</button>
  <div id="textos">

  </div>
  <script>
    let name = prompt("Qual é seu nome?");

    if (name == null || name == "") {
      name = "visitante";
    }
    document.getElementById("user_name").textContent = name;

    var paragraph = document.getElementById("textos");
    function addText() {
      text = "Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris nisi ut aliquip ex ea commodo consequat.";
      paragraph.textContent += text;
    }

    function clearText() {
      paragraph.textContent = "";
    }
  </script>
</body>

</html>
