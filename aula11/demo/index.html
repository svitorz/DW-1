<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo DevTools - Média</title>
    <link rel="stylesheet" href="css/estilo.css">
    <script src="js/media.js" defer></script>
</head>
<body>
    <main>
        <img src="img/icone-calculadora.png" alt="Ícone da calculadora" width="48">
        <h1>Calculadora de Média</h1>
        <label for="nota1">Nota 1</label>
        <input type="number" id="nota1" value="7">
        <label for="nota2">Nota 2</label>
        <input type="number" id="nota2" value="8">
        <button id="btnCalcular">Calcular média</button>
        <p id="resultado">Média: -</p>

        <hr>
        <button id="btnTurma">Carregar turma (JSON)</button>
        <ul id="listaTurma"></ul>
    </main>
</body>
</html>
