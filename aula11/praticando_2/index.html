<!DOCTYPE html>
<html data-bs-theme="light" lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Praticando 2 - Lâmpada</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
  <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
    crossorigin="anonymous"></script>
</head>

<body class="bg-black">
  <h1 class="text-center fg-white">Praticando 2 - Lâmpada</h1>
  <div class="container-fluid">
    <img src="img/lampada.png" id="lampada" class="mx-auto d-block">
    <p id="texto" class="fs-3xl text-center fg-white">Lâmpada apagada</p>
  </div>
  <script>
    const img = document.getElementById("lampada")
    const body = document.body;
    const texto = document.getElementById("texto")
    const titulo = document.getElementsByTagName("h1")

    img.addEventListener("mouseover", function () {
      acender()
    });

    img.addEventListener("mouseout", function () {
      apagar()
    });

    function acender() {
      img.src = "img/lampada-acesa.png";
      body.classList.add("bg-white")
      body.classList.remove("bg-black")
      texto.textContent = "Lâmpada acesa";
      titulo[0].classList.remove("fg-white")
      texto.classList.remove("fg-white")
      console.log(texto.classList);
    }

    function apagar() {
      img.src = "img/lampada.png";
      body.classList.remove("bg-white")
      body.classList.add("bg-black")
      texto.textContent = "Lâmpada apagada";
      titulo[0].classList.add("fg-white")
      texto.classList.add("fg-white")
      console.log(texto.classList);
    }
  </script>
</body>

</html>
