<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Praticando 3 - Validações</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
        crossorigin="anonymous"></script>
</head>

<body>
    <h1 class="text-center">
        Praticando 3 - Validações
    </h1>
    <div class="container-fluid m-4">
        <form class="grid grid-cols-1 gap-5">
            <div class="grid gap-5">
                <div class="form-field md:g-col-4">
                    <label for="first_name" class="form-label">First name</label>
                    <input type="text" class="form-control is-invalid" id="first_name" value="" required>
                    <div id="first_nameValid" class="valid-feedback">Looks great!</div>
                    <div id="first_nameInvalid" class="invalid-feedback">First name is required</div>
                </div>
                <div class="form-field md:g-col-4">
                    <label for="last_name" class="form-label">First name</label>
                    <input type="text" class="form-control is-invalid" id="last_name" value="" required>
                    <div id="last_nameValid" class="valid-feedback">Looks great!</div>
                    <div id="last_nameInvalid" class="invalid-feedback">Last name is required</div>
                </div>
                <div class="form-field md:g-col-4">
                    <label for="user_name" class="form-label">Username</label>
                    <input type="text" class="form-control is-invalid" id="last_name" value="" required>
                    <div id="user_nameValid" class="valid-feedback">Looks great!</div>
                    <div id="user_nameInvalid" class="invalid-feedback">Username is required</div>
                </div>
            </div>
            <div class="grid gap-5">
                <div class="form-field md:g-col-6">
                    <label for="city" class="form-label">City</label>
                    <input type="text" class="form-control is-invalid" id="city" aria-describedby="cityFeedback">
                    <div id="cityFeedback" class="invalid-feedback">Please provide a city</div>
                    <div id="cityValid" class="valid-feedback">Looks great!</div>
                </div>
                <div class="form-field md:g-col-6">
                    <label for="zip_code" class="form-label">Zip</label>
                    <input type="text" class="form-control is-invalid" id="zip_code"
                        aria-describedby="zip_codeFeedback">
                    <div id="zip_codeValid" class="valid-feedback">Looks great!</div>
                    <div id="zip_codeFeedback" class="invalid-feedback">Required</div>
                </div>
            </div>
        </form>
    </div>
    <script>
        const inputs = document.querySelectorAll("input")

        inputs.forEach(function (input) {
            input.addEventListener("change", (event) => {
                if (event.target.value) {
                    input.classList.remove("is-invalid")
                    input.classList.add("is-valid")
                } else {
                    input.classList.add("is-invalid")
                    input.classList.remove("is-valid")
                }
            })
        });
    </script>
</body>

</html>
