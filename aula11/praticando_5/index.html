<!DOCTYPE html>
<html data-bs-theme="light" lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Praticando 5 - Mini Game JS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
  <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
    crossorigin="anonymous"></script>
  <style>
    .box {
      width: 10em;
      height: 10em;
    }

    .red {
      background-color: red;
    }

    .blue {
      background-color: blue;
    }

    .green {
      background-color: green;
    }
  </style>
</head>

<body>
  <div class="container-fluid">
    <h1>Praticando 5 - Mini-game JS</h1>
    <h2 class="underline">Instruções</h2>
    <ol>
      <li>Clique em um dos quadrados coloridos</li>
      <li>Depois use as teclas <kbd>W</kbd> <kbd>A</kbd> <kbd>S</kbd> <kbd>D</kbd>para movimentar os elementos para
        cima,
        esquerda, baixo e direita
        respectivamente.</li>
    </ol>
    <img src="img/wasd.jpg">
    <div class="d-flex align-items-center gap-10">
      <div class="box border border-5 border-black red"> </div>
      <div class="box border border-5 border-black blue"> </div>
      <div class="box border border-5 border-black green"> </div>
    </div>
  </div>
  <script src="script.js">
  </script>
</body>

</html>
