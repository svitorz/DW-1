<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Página 2 - Tabelas com colspan e rowspan</title>
  <style>
    table,
    td {
      border: 1px solid red;
    }

    td {
      padding: 30px 60px;
      text-align: center;
    }
  </style>
  <link rel="icon" type="image/x-icon" href="../assets/icons/icons8-tabela-24.png">
</head>

<body>
  <h1>
    Página 2 - Tabelas com colspan e rowspan
  </h1>
  <section>
    <h2>
      Tabela com colspan
    </h2>
    <table>
      <caption>
        Tabela com colspan
      </caption>
      <tr>
        <td colspan="3">COLSPAN</td>
      </tr>
      <tr>
        <td>-</td>
        <td>-</td>
        <td>-</td>
      </tr>
    </table>
  </section>

  <section>
    <h2>
      Tabela com rowspan
    </h2>
    <table>
      <caption>
        Tabela com rowspan
      </caption>

      <tr>
        <td>-</td>
        <td rowspan="3">rospan</td>
      </tr>
      <tr>
        <td>-</td>
      </tr>
      <tr>
        <td>-</td>
      </tr>
    </table>
  </section>

  <section>
    <h2>
      Tabela com colspan e rowspan
    </h2>
    <table>
      <tr>
        <td colspan="2">colspan</td>
        <td>-</td>
        <td rowspan="3">rowspan</td>
      </tr>
      <tr>
        <td>-</td>
        <td>-</td>
        <td>-</td>
      </tr>
      <tr>
        <td>-</td>
        <td colspan="2">colspan</td>
      </tr>
      <tr>
        <td>-</td>
        <td>-</td>
        <td>-</td>
        <td>-</td>
      </tr>
    </table>
  </section>
  <footer>
    <br>
    <a href="../index.html">Voltar ao menu principal</a>
    <br>
    &copy;Vitor Fábio
  </footer>
</body>

</html>
