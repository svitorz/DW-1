<!DOCTYPE html>
<html data-bs-theme="light" lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contatos</title>
  <link rel="icon" type="image/svg+xml" href="./img/favicon.svg">
  <script>
    // Aplica o tema salvo antes da página renderizar, para não piscar o tema claro.
    (function () {
      try {
        const salvo = localStorage.getItem("tema");
        if (salvo === "dark" || salvo === "light") {
          document.documentElement.setAttribute("data-bs-theme", salvo);
        }
      } catch (e) {
        // localStorage indisponível (ex.: navegador bloqueou): segue com o tema claro padrão
      }
    })();
  </script>
  <!-- Bootstrap CSS -->
  <link href="./bootstrap/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="./bootstrap-icons/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="./css/style.css">

  <!-- jQuery -->
  <script src="./jquery/dist/jquery.min.js"></script>

</head>

<body>
  <header class="ct-topo">
    <div class="container-fluid px-4 d-flex align-items-end flex-wrap gap-3">
      <div>
        <h1 class="ct-titulo">Contatos</h1>
        <p class="ct-subtitulo">Trabalho T2 de Ajax com JSON, por Vitor Fábio</p>
      </div>
      <button type="button" id="toggle-tema" class="btn-icon btn-subtle theme-secondary ms-auto"
        aria-label="Usar tema escuro" title="Alternar tema">
        <i class="bi bi-moon-stars" aria-hidden="true"></i>
      </button>
    </div>
  </header>

  <main class="container-fluid px-4 pb-5">

    <div class="toast-container position-fixed top-0 end-0 p-3" id="toast-container"></div>

    <template id="toast-template">
      <div class="toast align-items-center border-0" role="alert" aria-live="assertive" aria-atomic="true">
        <div class="d-flex">
          <div class="toast-body">
            <div class="fw-bold toast-title d-flex align-items-center gap-2">
              <i class="bi toast-icon" aria-hidden="true"></i>
              <span class="toast-title-text"></span>
            </div>
            <div class="toast-message"></div>
          </div>
          <button type="button" class="btn-close me-2 m-auto" aria-label="Fechar"></button>
        </div>
      </div>
    </template>

    <div class="row g-4">

      <section class="col-12 lg:col-4">
        <div class="ct-painel h-100">
          <div class="ct-cabecalho">
            <h2 class="ct-secao">Novo contato</h2>
          </div>
          <form class="p-4">
            <div class="mb-3">
              <label for="name" class="form-label">Nome</label>
              <input type="text" class="form-control" id="name" placeholder="Ana Souza">
            </div>
            <div class="mb-4">
              <label for="email" class="form-label">E-mail</label>
              <input type="email" class="form-control" id="email" placeholder="ana@exemplo.com">
            </div>
            <div class="d-flex gap-2">
              <button type="button" id="send-button" class="btn-solid theme-primary"><i class="bi bi-floppy me-1"
                  aria-hidden="true"></i>Gravar</button>
              <button type="reset" class="btn-outline theme-secondary">Limpar</button>
            </div>
          </form>
        </div>
      </section>

      <section class="col-12 lg:col-8">
        <div class="ct-ficha h-100">
          <div class="ct-cabecalho">
            <h2 class="ct-secao">Contatos cadastrados</h2>
            <div class="d-flex align-items-center flex-wrap gap-2 ms-auto">
              <span id="record-count" class="ct-contador">…</span>
              <button type="button" id="updateTable" class="btn-subtle theme-primary btn-sm">
                <i class="bi bi-arrow-repeat me-1" aria-hidden="true"></i><span>Atualizar dados da tabela</span>
              </button>
            </div>
          </div>

          <div id="loading" class="d-none justify-content-center py-3">
            <div class="spinner-border" role="status">
              <span class="visually-hidden">Carregando…</span>
            </div>
          </div>

          <div class="ct-ficha-corpo">
            <nav id="indice-letras" class="ct-indice" aria-label="Índice alfabético"></nav>
            <div class="table-responsive ct-lista">
              <table class="table ct-tabela align-middle mb-0">
                <thead>
                  <tr class="border-bottom">
                    <th scope="col" class="fw-normal ct-tinta-suave ps-4">Nome</th>
                    <th scope="col" class="fw-normal ct-tinta-suave">E-mail</th>
                    <th scope="col" class="fw-normal ct-tinta-suave text-end pe-4">Ação</th>
                  </tr>
                </thead>
                <tbody id="table-line"></tbody>
              </table>
            </div>
          </div>
        </div>

        <template id="row-template">
          <tr class="ct-linha">
            <td class="col-nome ps-4 fw-semibold" data-field="nome"></td>
            <td class="col-email" data-field="email"></td>
            <td class="col-acao text-end pe-4">
              <button type="button" class="btn-outline theme-danger btn-sm btn-delete">
                <i class="bi bi-trash3 me-1" aria-hidden="true"></i>Excluir
              </button>
            </td>
          </tr>
        </template>
      </section>

    </div>
  </main>

  <dialog id="confirm-delete-dialog" class="dialog">
    <div class="dialog-header">
      <i class="bi bi-exclamation-triangle-fill fg-danger me-2" aria-hidden="true"></i>
      <h5 class="mb-0">Excluir contato?</h5>
    </div>
    <div class="dialog-body">
      <p class="mb-0"><strong id="confirm-delete-name"></strong> será excluído do banco compartilhado da turma.
        Isso não pode ser desfeito.</p>
    </div>
    <div class="dialog-footer">
      <button type="button" class="btn-subtle theme-secondary" id="cancel-delete">Cancelar</button>
      <button type="button" class="btn-solid theme-danger" id="confirm-delete"><i class="bi bi-trash3 me-1"
          aria-hidden="true"></i>Excluir</button>
    </div>
  </dialog>

  <script>
    $(document).ready(function () {
      $("#updateTable").on("click", atualizarManual);
      $("#toggle-tema").on("click", alternarTema);
      aplicarTema(temaAtual());
      $("#send-button").on("click", sendData);

      // Enter nos campos envia, mas só se nome e e-mail estiverem preenchidos
      $("#name, #email").on("keydown", function (e) {
        if (e.key !== "Enter") return;
        e.preventDefault();
        const preenchidos = $("#name").val().trim() && $("#email").val().trim();
        if (preenchidos && !$("#send-button").prop("disabled")) sendData();
      });

      $("#table-line").on("click", ".btn-delete", function () {
        const id = $(this).attr("data-id");
        const nome = $(this).attr("data-nome");
        askDeleteConfirmation(id, nome);
      });

      $("#cancel-delete").on("click", function () {
        closeDeleteDialog();
      });

      $("#confirm-delete").on("click", function () {
        const id = $("#confirm-delete-dialog").data("id");
        closeDeleteDialog();
        deleteData(id);
      });

      fetchData();
    });

    function temaAtual() {
      return document.documentElement.getAttribute("data-bs-theme") === "dark" ? "dark" : "light";
    }

    function aplicarTema(tema) {
      document.documentElement.setAttribute("data-bs-theme", tema);
      const escuro = tema === "dark";
      $("#toggle-tema i").attr("class", escuro ? "bi bi-sun" : "bi bi-moon-stars");
      $("#toggle-tema").attr("aria-label", escuro ? "Usar tema claro" : "Usar tema escuro");
    }

    function alternarTema() {
      const novo = temaAtual() === "dark" ? "light" : "dark";
      aplicarTema(novo);
      salvarTema(novo);
    }

    function salvarTema(tema) {
      try {
        localStorage.setItem("tema", tema);
      } catch (e) {
        // sem localStorage: o tema vale só nesta visita
      }
    }

    const rowTemplate = document.getElementById("row-template");
    const deleteDialog = document.getElementById("confirm-delete-dialog");
    const ESPERA_ATUALIZAR_MS = 5000; // 5 segundos entre atualizações manuais
    let atualizarLiberadoEm = 0;
    let requisicaoLista = null;

    function askDeleteConfirmation(id, nome) {
      $("#confirm-delete-dialog").data("id", id);
      $("#confirm-delete-name").text(nome ?? "");
      deleteDialog.showModal();
    }

    function closeDeleteDialog() {
      deleteDialog.close();
    }

    function deleteData(id) {
      const url = `https://epansani.com.br/2026/dwe1/ajax/rem.php`;

      const body = JSON.stringify({
        id: Number(id),
      });

      $.ajax({
        url: url,
        headers: {"Content-Type": "application/json"},
        method: 'POST',
        contentType: 'application/json',
        data: body,
        dataType: "json",

        success: function (data) {
          showToast(data.ok ? "Contato excluído" : "Não foi possível excluir", mensagemDaApi(data, "Operação concluída."), data.ok);

          fetchData();
        },

        error: function (xhr) {
          const message = mensagemDaApi(xhr.responseJSON, "Erro ao excluir contato.");
          showToast("Não foi possível excluir", message, false);
          fetchData();
        }
      });
    }

    function sendData() {
      const nome = $("#name").val().trim();
      const email = $("#email").val().trim();

      const erros = validateContact(nome, email);
      if (erros.length > 0) {
        erros.forEach(erro => showToast("Verifique o formulário", erro, false));
        return;
      }

      const url = `https://epansani.com.br/2026/dwe1/ajax/ins.php`;

      const body = JSON.stringify({
        nome: nome,
        email: email
      });

      $("#send-button").prop("disabled", true);

      $.ajax({
        url: url,
        method: 'POST',
        headers: {"Content-Type": "application/json"},
        contentType: 'application/json',
        data: body,
        dataType: "json",

        success: function (data) {
          showToast(data.ok ? "Contato gravado" : "Não foi possível gravar", mensagemDaApi(data, "Operação concluída."), data.ok);

          if (data.ok) limparFormulario();
          fetchData();
        },

        error: function (xhr) {
          const message = mensagemDaApi(xhr.responseJSON, "Erro ao cadastrar contato.");
          showToast("Não foi possível gravar", message, false);
          fetchData();
        },

        complete: function () {
          $("#send-button").prop("disabled", false);
        }
      });
    }

    function limparFormulario() {
      $("#name").val("");
      $("#email").val("");
    }

    function atualizarManual() {
      const agora = Date.now();
      if (agora < atualizarLiberadoEm) {
        const segundos = Math.ceil((atualizarLiberadoEm - agora) / 1000);
        showToast("Aguarde", `Você poderá atualizar novamente em ${segundos}s.`, false);
        return;
      }

      atualizarLiberadoEm = agora + ESPERA_ATUALIZAR_MS;
      iniciarContagemBotao();
      fetchData();
    }

    function iniciarContagemBotao() {
      const $btn = $("#updateTable");
      const $texto = $btn.find("span");
      const textoOriginal = "Atualizar dados da tabela";
      $btn.prop("disabled", true);

      const timer = setInterval(() => {
        const restante = Math.ceil((atualizarLiberadoEm - Date.now()) / 1000);
        if (restante <= 0) {
          clearInterval(timer);
          $btn.prop("disabled", false);
          $texto.text(textoOriginal);
        } else {
          $texto.text(`Aguarde ${restante}s`);
        }
      }, 250);
    }

    function updateRecordCount(total) {
      const texto = total === 1 ? "1 contato" : `${total} contatos`;
      $("#record-count").text(texto);
    }

    function fetchData() {
      $("#loading").removeClass("d-none").addClass("d-flex");
      $("#table-line").empty();
      $("#record-count").text("carregando…");
      const url = `https://epansani.com.br/2026/dwe1/ajax/list.php`;

      if (requisicaoLista) requisicaoLista.abort();

      requisicaoLista = $.ajax({
        url: url,
        method: 'GET',
        headers: {"Content-Type": "application/json"},
        contentType: 'application/json',
        dataType: "json",
        success: function (data) {
          if (data.length === 0) {
            $("#table-line")[0].replaceChildren(renderEmpty());
          } else {
            const ordenados = [...data].sort((a, b) =>
              a.nome.localeCompare(b.nome, "pt-BR", { sensitivity: "base" }));
            const linhas = [];
            let letraAtual = null;
            ordenados.forEach(item => {
              const letra = letraInicial(item.nome);
              if (letra !== letraAtual) {
                linhas.push(renderGrupo(letra));
                letraAtual = letra;
              }
              linhas.push(renderRow(item));
            });
            $("#table-line")[0].replaceChildren(...linhas);
          }
          renderIndice(data);
          updateRecordCount(data.length);
        },
        error: function (xhr, status) {
          if (status === "abort") return; // cancelada de propósito por uma listagem mais nova
          showToast("Sem resposta da API", "Não foi possível carregar a lista. Tente atualizar em alguns segundos.", false);
          $("#record-count").text("—");
        },
        complete: function (xhr) {
          if (xhr === requisicaoLista) {
            requisicaoLista = null;
            $("#loading").addClass("d-none").removeClass("d-flex");
          }
        }
      });
    }

    function renderRow(item) {
      const row = rowTemplate.content.cloneNode(true);
      row.querySelector('[data-field="nome"]').textContent = item.nome;

      const emailEl = row.querySelector('[data-field="email"]');
      const link = document.createElement("a");
      link.href = `mailto:${item.email}`;
      link.className = "dado";
      link.textContent = item.email;
      emailEl.replaceChildren(link);

      const btn = row.querySelector(".btn-delete");
      btn.setAttribute("aria-label", `Excluir ${item.nome}`);
      btn.dataset.nome = item.nome;
      btn.dataset.id = item.id;

      return row;
    }

    function renderEmpty() {
      const tr = document.createElement("tr");
      const td = document.createElement("td");
      td.colSpan = 3;
      td.className = "text-center py-5 ct-tinta-suave";

      const icon = document.createElement("i");
      icon.className = "bi bi-inbox d-block mb-2";
      icon.style.fontSize = "2rem";
      icon.setAttribute("aria-hidden", "true");

      td.append(icon, "Nenhum contato ainda. Cadastre o primeiro no formulário.");
      tr.append(td);
      return tr;
    }

    function letraInicial(nome) {
      const letra = nome.trim().charAt(0)
        .normalize("NFD").replace(/[̀-ͯ]/g, "")
        .toUpperCase();
      return /^[A-Z]$/.test(letra) ? letra : "#";
    }

    function renderGrupo(letra) {
      const tr = document.createElement("tr");
      tr.className = "ct-grupo";
      const th = document.createElement("th");
      th.colSpan = 3;
      th.id = letra === "#" ? "letra-outros" : `letra-${letra}`;
      th.textContent = letra;
      tr.append(th);
      return tr;
    }

    const LETRAS = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");

    function renderIndice(contatos) {
      const presentes = new Set(contatos.map(c => letraInicial(c.nome)));
      const itens = LETRAS.map(letra => {
        if (presentes.has(letra)) {
          const a = document.createElement("a");
          a.className = "ct-aba";
          a.href = `#letra-${letra}`;
          a.textContent = letra;
          a.setAttribute("aria-label", `Ir para a letra ${letra}`);
          return a;
        }
        const span = document.createElement("span");
        span.className = "ct-aba is-vazia";
        span.textContent = letra;
        span.setAttribute("aria-hidden", "true");
        return span;
      });
      if (presentes.has("#")) {
        const a = document.createElement("a");
        a.className = "ct-aba";
        a.href = "#letra-outros";
        a.textContent = "#";
        a.setAttribute("aria-label", "Ir para nomes que não começam com letra");
        itens.push(a);
      }
      document.getElementById("indice-letras").replaceChildren(...itens);
    }

    function mensagemDaApi(resposta, padrao) {
      return resposta?.mensagem ?? resposta?.message ?? padrao;
    }

    function showToast(title, message, ok = true) {
      const el = document.getElementById("toast-template").content.firstElementChild.cloneNode(true);

      el.classList.add(...(ok ? ["bg-success", "fg-contrast-success"] : ["bg-danger", "fg-contrast-danger"]));
      el.querySelector(".toast-icon").classList.add(ok ? "bi-check-circle-fill" : "bi-x-circle-fill");
      el.querySelector(".toast-title-text").textContent = title;
      el.querySelector(".toast-message").textContent = message;

      document.getElementById("toast-container").appendChild(el);
      el.classList.add("show");

      const fechar = () => {
        el.classList.remove("show");
        setTimeout(() => el.remove(), 300); // espera a animação de saída
      };
      el.querySelector(".btn-close").addEventListener("click", fechar);
      setTimeout(fechar, 4000);
    }

    function validateContact(nome, email) {
      const erros = [];

      if (!nome) {
        erros.push("Informe o nome.");
      } else if (nome.length < 3) {
        erros.push("O nome deve ter pelo menos 3 caracteres.");
      } else if (nome.length > 100) {
        erros.push("O nome deve ter no máximo 100 caracteres.");
      }

      if (!email) {
        erros.push("Informe o e-mail.");
      } else if (email.length > 100) {
        erros.push("O e-mail deve ter no máximo 100 caracteres.");
      } else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        erros.push("Informe um e-mail válido (ex.: nome@dominio.com).");
      }

      return erros;
    }
  </script>
</body>

</html>
