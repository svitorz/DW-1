<!DOCTYPE html>
<html data-bs-theme="light" lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contatos · Gerenciamento</title>
  <link rel="icon" type="image/svg+xml" href="./img/favicon.svg">
  <!-- Bootstrap CSS -->
  <link href="./bootstrap/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="./bootstrap-icons/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="./css/style.css">

  <!-- jQuery -->
  <script src="./jquery/dist/jquery.min.js"></script>

</head>

<body>
  <header class="app-hero mb-4">
    <div class="container-fluid d-flex align-items-center gap-3">
      <img src="./img/favicon.svg" alt="" width="48" height="48" class="rounded-3 shadow-sm">
      <div>
        <h1 class="mb-1">Contatos</h1>
        <p class="mb-0 opacity-75">Gerenciamento de contatos</p>
      </div>
    </div>
  </header>

  <main class="container-fluid px-4 pb-5">

    <div class="toast-container position-fixed top-0 end-0 p-3" id="toast-container"></div>

    <template id="toast-template">
      <div class="toast align-items-center border-0" role="alert" aria-live="assertive" aria-atomic="true">
        <div class="d-flex">
          <div class="toast-body">
            <div class="fw-bold toast-title d-flex align-items-center gap-2">
              <i class="bi toast-icon" aria-hidden="true"></i>
              <span class="toast-title-text"></span>
            </div>
            <div class="toast-message"></div>
          </div>
          <button type="button" class="btn-close me-2 m-auto" data-bs-dismiss="toast" aria-label="Fechar"></button>
        </div>
      </div>
    </template>

    <div class="row g-4">

      <section class="col-12 lg:col-4">
        <div class="app-card h-100">
          <div class="app-card-header">
            <h5 class="mb-0"><i class="bi bi-person-plus me-2" aria-hidden="true"></i>Novo contato</h5>
          </div>
          <form class="p-4">
            <div class="mb-3">
              <label for="name" class="form-label fg-2">Nome</label>
              <div class="input-group">
                <span class="input-group-text fg-3"><i class="bi bi-person" aria-hidden="true"></i></span>
                <input type="text" class="form-control" id="name" placeholder="Maria">
              </div>
            </div>
            <div class="mb-4">
              <label for="email" class="form-label fg-2">Email</label>
              <div class="input-group">
                <span class="input-group-text fg-3"><i class="bi bi-envelope" aria-hidden="true"></i></span>
                <input type="email" class="form-control" id="email" placeholder="name@example.com">
              </div>
            </div>
            <div class="d-flex gap-2">
              <button type="button" id="send-button" class="btn-solid theme-primary"><i class="bi bi-floppy me-1"
                  aria-hidden="true"></i>Gravar</button>
              <button type="reset" class="btn-subtle theme-secondary">Limpar</button>
            </div>
          </form>
        </div>
      </section>

      <section class="col-12 lg:col-8">
        <div class="app-card h-100">
          <div class="app-card-header d-flex justify-content-between align-items-center flex-wrap gap-2">
            <h5 class="mb-0"><i class="bi bi-people me-2" aria-hidden="true"></i>Contatos cadastrados</h5>
            <div class="d-flex align-items-center gap-2">
              <span id="record-count" class="badge badge-subtle theme-info">…</span>
              <button type="button" id="updateTable" class="btn-icon btn-subtle theme-primary" title="Atualizar lista"
                aria-label="Atualizar lista">
                <i class="bi bi-arrow-repeat" aria-hidden="true"></i>
              </button>
            </div>
          </div>

          <div id="loading" class="d-none justify-content-center py-3">
            <div class="spinner-border" role="status">
              <span class="visually-hidden">Carregando…</span>
            </div>
          </div>

          <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
              <thead>
                <tr class="border-bottom">
                  <th scope="col" class="text-uppercase small fw-normal fg-3 ps-4" style="letter-spacing: .08em;">
                    Nome / E-mail</th>
                  <th scope="col" class="text-uppercase small fw-normal fg-3 text-end pe-4"
                    style="letter-spacing: .08em;">
                    Ação</th>
                </tr>
              </thead>
              <tbody id="table-line"></tbody>
            </table>
          </div>
        </div>

        <template id="row-template">
          <tr>
            <td class="ps-4">
              <div class="d-flex align-items-center gap-3">
                <span class="avatar avatar-sm avatar-subtle" data-field="avatar"></span>
                <div>
                  <div class="fw-semibold" data-field="nome"></div>
                  <div class="small fg-3" data-field="email"></div>
                </div>
              </div>
            </td>
            <td class="text-end pe-4">
              <button type="button" class="btn-icon btn-sm btn-subtle theme-danger rounded-3 btn-delete">
                <i class="bi bi-trash3" aria-hidden="true"></i>
              </button>
            </td>
          </tr>
        </template>
      </section>

    </div>
  </main>

  <dialog id="confirm-delete-dialog" class="dialog">
    <div class="dialog-header">
      <i class="bi bi-exclamation-triangle-fill fg-danger me-2" aria-hidden="true"></i>
      <h5 class="mb-0">Confirmar exclusão</h5>
    </div>
    <div class="dialog-body">
      <p class="mb-0">Tem certeza que deseja excluir o contato <strong id="confirm-delete-name"></strong>? Esta ação não
        pode ser desfeita.</p>
    </div>
    <div class="dialog-footer">
      <button type="button" class="btn-subtle theme-secondary" id="cancel-delete">Cancelar</button>
      <button type="button" class="btn-solid theme-danger" id="confirm-delete"><i class="bi bi-trash3 me-1"
          aria-hidden="true"></i>Excluir</button>
    </div>
  </dialog>

  <footer class="text-center py-4">
    <small class="fg-3">Desenvolvido por Vitor Fábio. <i class="bi bi-heart-fill fg-danger"
        aria-hidden="true"></i></small>
  </footer>
  <script type="module">
    import {Toast} from "./bootstrap/dist/js/bootstrap.bundle.min.js";

    $(document).ready(function () {
      $("#updateTable").on("click", fetchData);
      $("#send-button").on("click", sendData);

      $("#table-line").on("click", ".btn-delete", function () {
        const id = $(this).attr("data-id");
        const nome = $(this).attr("data-nome");
        askDeleteConfirmation(id, nome);
      });

      $("#cancel-delete").on("click", function () {
        closeDeleteDialog();
      });

      $("#confirm-delete").on("click", function () {
        const id = $("#confirm-delete-dialog").data("id");
        closeDeleteDialog();
        deleteData(id);
      });

      fetchData();
    });

    const rowTemplate = document.getElementById("row-template");
    const deleteDialog = document.getElementById("confirm-delete-dialog");
    const temasAvatar = ["theme-primary", "theme-info", "theme-success", "theme-warning", "theme-accent"];

    function askDeleteConfirmation(id, nome) {
      $("#confirm-delete-dialog").data("id", id);
      $("#confirm-delete-name").text(nome ?? "");
      deleteDialog.showModal();
    }

    function closeDeleteDialog() {
      deleteDialog.close();
    }

    function deleteData(id) {
      const url = `https://epansani.com.br/2026/dwe1/ajax/rem.php`;

      const body = JSON.stringify({
        id: id,
      });

      $.ajax({
        url: url,
        headers: {"Content-Type": "application/json"},
        method: 'POST',
        contentType: 'application/json',
        data: body,
        dataType: "json",

        success: function (data) {
          showToast(data.ok ? "Contato excluído" : "Erro ao excluir", mensagemDaApi(data, "Operação concluída."), data.ok);

          afterSubmit();
        },

        error: function (xhr) {
          const message = mensagemDaApi(xhr.responseJSON, "Erro ao excluir contato.");
          showToast("Erro ao excluir", message, false);
          afterSubmit();
        }
      });
    }

    function sendData() {
      const nome = $("#name").val().trim();
      const email = $("#email").val().trim();

      const erros = validateContact(nome, email);
      if (erros.length > 0) {
        erros.forEach(erro => showToast("Dados inválidos", erro, false));
        return;
      }

      const url = `https://epansani.com.br/2026/dwe1/ajax/ins.php`;

      const body = JSON.stringify({
        nome: nome,
        email: email
      });

      $("#send-button").prop("disabled", true);

      $.ajax({
        url: url,
        method: 'POST',
        headers: {"Content-Type": "application/json"},
        contentType: 'application/json',
        data: body,
        dataType: "json",

        success: function (data) {
          showToast(data.ok ? "Contato cadastrado" : "Erro ao cadastrar", mensagemDaApi(data, "Operação concluída."), data.ok);

          afterSubmit();
        },

        error: function (xhr) {
          const message = mensagemDaApi(xhr.responseJSON, "Erro ao cadastrar contato.");
          showToast("Erro ao cadastrar", message, false);
          afterSubmit();
        },

        complete: function () {
          $("#send-button").prop("disabled", false);
        }
      });
    }

    function afterSubmit() {
      $("#name").val("");
      $("#email").val("");
      fetchData();
    }

    function updateRecordCount(total) {
      const texto = total === 1 ? "1 registro" : `${total} registros`;
      $("#record-count").text(texto);
    }

    function fetchData() {
      $("#loading").removeClass("d-none").addClass("d-flex");
      $("#table-line").empty();
      $("#record-count").text("carregando…");
      const url = `https://epansani.com.br/2026/dwe1/ajax/list.php`;

      $.ajax({
        url: url,
        method: 'GET',
        headers: {"Content-Type": "application/json"},
        contentType: 'application/json',
        dataType: "json",
        success: function (data) {
          if (data.length === 0) {
            $("#table-line")[0].replaceChildren(renderEmpty());
          } else {
            $("#table-line")[0].replaceChildren(...data.map(renderRow));
          }
          updateRecordCount(data.length);
        },
        error: function (error) {
          showToast("Erro de conexão", "Falha na comunicação com o servidor.", false);
          $("#record-count").text("—");
          return;
        },
        complete: function () {$("#loading").addClass("d-none").removeClass("d-flex")}
      });
    }

    function renderRow(item) {
      const row = rowTemplate.content.cloneNode(true);
      row.querySelector('[data-field="nome"]').textContent = item.nome;

      const avatar = row.querySelector('[data-field="avatar"]');
      avatar.textContent = iniciais(item.nome);
      avatar.classList.add(temaPorNome(item.nome));

      const emailEl = row.querySelector('[data-field="email"]');
      const link = document.createElement("a");
      link.href = `mailto:${item.email}`;
      link.className = "fg-2";
      link.textContent = item.email;
      emailEl.replaceChildren(link);

      const btn = row.querySelector(".btn-delete");
      btn.setAttribute("aria-label", `Excluir ${item.nome}`);
      btn.dataset.nome = item.nome;
      btn.dataset.id = item.id;

      return row;
    }

    function renderEmpty() {
      const tr = document.createElement("tr");
      const td = document.createElement("td");
      td.colSpan = 2;
      td.className = "text-center py-5 fg-3";

      const icon = document.createElement("i");
      icon.className = "bi bi-inbox d-block mb-2";
      icon.style.fontSize = "2.5rem";
      icon.setAttribute("aria-hidden", "true");

      td.append(icon, "Nenhum contato cadastrado ainda");
      tr.append(td);
      return tr;
    }

    function iniciais(nome) {
      const partes = nome.trim().split(/\s+/);
      const primeira = partes[0]?.charAt(0) ?? "";
      const ultima = partes.length > 1 ? partes[partes.length - 1].charAt(0) : "";
      return (primeira + ultima).toUpperCase();
    }

    function temaPorNome(nome) {
      let soma = 0;
      for (const c of nome) soma += c.charCodeAt(0);
      return temasAvatar[soma % temasAvatar.length];
    }

    function mensagemDaApi(resposta, padrao) {
      return resposta?.mensagem ?? resposta?.message ?? padrao;
    }

    function showToast(title, message, ok = true) {
      const el = document.getElementById("toast-template").content.firstElementChild.cloneNode(true);

      el.classList.add(...(ok ? ["bg-success", "fg-contrast-success"] : ["bg-danger", "fg-contrast-danger"]));
      el.querySelector(".toast-icon").classList.add(ok ? "bi-check-circle-fill" : "bi-x-circle-fill");
      el.querySelector(".toast-title-text").textContent = title;
      el.querySelector(".toast-message").textContent = message;

      el.addEventListener("hidden.bs.toast", () => el.remove());
      document.getElementById("toast-container").appendChild(el);

      Toast.getOrCreateInstance(el, {
        delay: 4000
      }).show();
    }

    function validateContact(nome, email) {
      const erros = [];

      if (!nome) {
        erros.push("O campo Nome é obrigatório.");
      } else if (nome.length < 3) {
        erros.push("O nome deve ter pelo menos 3 caracteres.");
      } else if (nome.length > 100) {
        erros.push("O nome deve ter no máximo 100 caracteres.");
      }

      if (!email) {
        erros.push("O campo Email é obrigatório.");
      } else if (email.length > 255) {
        erros.push("O e-mail deve ter no máximo 255 caracteres.");
      } else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        erros.push("Informe um e-mail válido (ex.: nome@dominio.com).");
      }

      return erros;
    }
  </script>
</body>

</html>
