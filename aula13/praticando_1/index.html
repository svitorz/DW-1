<!DOCTYPE html>
<html data-bs-theme="light" lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Praticando 1 - Mostrar e Esconder</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
  <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
    crossorigin="anonymous"></script>
  <script src="https://code.jquery.com/jquery-4.0.0.js" integrity="sha256-9fsHeVnKBvqh3FB2HYu7g2xseAZ5MlN6Kz/qnkASV8U="
    crossorigin="anonymous"></script>
</head>

<body>
  <div class="container-fluid p-2">
    <h1 class="text-center">Praticando 1 - Mostrar/esconder</h1>
    <div class="d-flex justify-content-evenly align-items-center">
      <button type="button" id="mostrar">Mostrar</button>
      <button type="button" id="toggle">Alternar</button>
      <button type="button" class="float-end" id="esconder">Esconder</button>
    </div>
    <div class="w-100 h-auto text-center bg-info m-5 p-5" id="box">
      <h2>
        Meu div
      </h2>
    </div>
  </div>
  <script>
    $("#mostrar").click(function () {
      //$("#box").removeClass("d-none")
      $("#box").show()
    })

    $("#esconder").click(function () {
      //$("#box").addClass("d-none")
      $("#box").hide()
    })

    $("#toggle").click(() => {
      $("#box").toggle()
    })
  </script>
</body>

</html>
