<!DOCTYPE html>
<html data-bs-theme="light" lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Praticando 4 - Manipulações</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
  <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
    crossorigin="anonymous"></script>
  <script src="https://code.jquery.com/jquery-4.0.0.js" integrity="sha256-9fsHeVnKBvqh3FB2HYu7g2xseAZ5MlN6Kz/qnkASV8U="
    crossorigin="anonymous"></script>
</head>

<body>
  <div class="container-fluid m-5 text-center">
    <h1>
      Praticando 4 - Manipulações
    </h1>
    <div class="row align-items-start">
      <div class="col">
        <div class="btn-group" role="group" aria-label="Basic example">
          <button type="button" id="moveLeft" class="theme-primary btn-solid btn-styled">
            Esquerdo
          </button>
          <button type="button" id="moveRight" class="theme-primary btn-outline btn-styled">
            Direito
          </button>
        </div>
      </div>
      <div class="col">
        <button type="button" id="addText" class="theme-primary btn-solid btn-styled">
          Adicionar
        </button>
        <button type="button" id="removeFirstPar" class="theme-primary btn-solid btn-styled">
          Remover primeiro
        </button>
        <button type="button" id="removeLastPar" class="theme-primary btn-solid btn-styled">
          Remover último
        </button>
        <button type="button" id="removeAll" class="theme-primary btn-solid btn-styled">
          Remover todos
        </button>
      </div>
      <div class="col">
        <button type="button" id="addImg" class="theme-primary btn-solid btn-styled">Adicionar</button>
        <button type="button" id="removeOneImg" class="theme-primary btn-solid btn-styled">Remover uma</button>
        <button type="button" id="removeAllImg" class="theme-primary btn-solid btn-styled">Remover todas</button>
      </div>
    </div>
    <div id="paragraph" class="float-start">
      <ul id="text">
      </ul>
      <div id="imgs"></div>
    </div>
  </div>
  <script>
    $(document).ready(function () {
      let counter = 0;
      $("#moveRight").click(function () {
        $("#paragraph").addClass("float-end").removeClass("float-start")
        $("#moveLeft").removeClass("btn-solid").addClass("btn-outline")
        $(this).removeClass("btn-outline").addClass("btn-solid")
      });

      $("#moveLeft").click(function () {
        $("#paragraph").removeClass("float-end").addClass("float-start")
        $("#moveRight").removeClass("btn-solid").addClass("btn-outline")
        $(this).removeClass("btn-outline").addClass("btn-solid")
      });

      $("#removeFirstPar").click(() => {$("#paragraph").children("li").get(0).remove()})
      $("#removeLastPar").click(() => {$("#paragraph").children("li").get($("#paragraph").children("li").length - 1).remove()})
      $("#removeAll").click(() => {$("#paragraph").children("li").remove()})

      $("#removeOneImg").click(() => {$("#imgs").children("img").get(0).remove()})
      $("#removeAllImg").click(() => {$("#imgs").children("img").remove()})

      $("#addImg").click(() => {$("#imgs").prepend('<img class="w-12 img-thumbnail" src="./img/gatinho.jpg" />')});
      $("#addText").click(function () {$("#paragraph").append("<li>#" + counter++ + " Lorem ipsum dolor sit amet, consectur adipisicing elit. </li>")});
    });
  </script>
</body>

</html>
